/* DARK MOBILE responsive redesign — desktop + mobile */
:root{--red:#d71926;--red2:#ff343f;--redsoft:#2b0d11;--radius:12px;--glow:0 8px 28px rgba(0,0,0,.28)}
body{background:radial-gradient(ellipse at 50% -16%,#292a2e 0,transparent 45%),#0b0c0f;line-height:1.45}
.topbar{height:82px;gap:24px;padding-inline:max(28px,calc((100% - 1320px)/2));background:rgba(24,25,28,.97);backdrop-filter:blur(14px);border-bottom:1px solid #33363c}
.brand{height:68px;width:178px;border-color:#45474c;background:#141519;font-weight:700;letter-spacing:1px}
.brand-mark{font-size:24px}
.wrap{max-width:1320px;padding:28px 26px 52px}
.hero{border-color:#383b41;background:linear-gradient(115deg,#17181c,#101115 58%,#1d1013);box-shadow:0 12px 34px #0005;padding:28px 32px}
.hero-emblem{border-color:#4b252a;background:linear-gradient(145deg,#1d0b0e,#08090b);color:#ff3a45}
.section,.side-card{border-color:#3d4148;background:linear-gradient(145deg,#111216,#0d0e12);box-shadow:0 9px 28px #0004}
.section-title,.side-title{background:linear-gradient(100deg,#1e1f23,#17181c);border-bottom-color:#303238}
.section-title{font-size:22px;padding:18px 22px}
.forum-category{border-color:#393d43;background:#0d0e12;box-shadow:0 6px 20px #0003;margin-bottom:18px}
.category-head{background:linear-gradient(100deg,#202125,#17181c);border-bottom-color:#303238;color:#ff424c;padding:15px 20px;font-size:21px;letter-spacing:.25px}
.forum-row{grid-template-columns:118px minmax(0,1fr);gap:18px;padding:22px 20px;min-height:142px;transition:background .18s,border-color .18s}
.forum-row:hover{background:#141519}
.forum-icon{width:86px;height:86px;background:radial-gradient(circle at 40% 30%,#191a1f,#050608 72%);border:1px solid #25272d;box-shadow:inset 0 0 18px #0008;color:#f1f1f3}
.forum-name{font-size:24px;letter-spacing:-.25px;text-shadow:none}
.forum-meta{color:#b2b5bc;font-size:14px}
.lastpost{max-width:100%;font-size:14px}
.lastpost span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.label{border-radius:5px;background:linear-gradient(180deg,#f12834,#c70f1b);font-size:11px;letter-spacing:.2px}
.new-tag{background:linear-gradient(120deg,#ff8d22,#e45b10);border-radius:2px}
.sidebar{min-width:0}
.side-title{font-size:19px}
.online-user,.message-card,.profile-message{border:1px solid #25282e;background:#17181d}
.online-user{transition:border-color .15s}
.online-user:hover{border-color:#743039}
.avatar{border-color:#d71926;box-shadow:0 0 0 2px #d7192618}
.topic-row{padding:17px 16px;transition:background .15s}
.topic-row:hover{background:#15161b}
.topic-title{font-size:17px}
.post{background:#0e0f13}
.post-author{background:linear-gradient(180deg,#17181d,#111216);border-right-color:#2b2d33}
.post-author .avatar{box-shadow:0 0 0 4px #24252b;margin-bottom:15px}
.post-content{overflow-wrap:anywhere}
.post-top{align-items:center}
.profile-cover{height:190px;background:linear-gradient(115deg,#3b0b11 0%,#17181d 48%,#28090e 100%);border-bottom:2px solid #a91b26;overflow:hidden}
.profile-cover:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,#ffffff06 35.2%,transparent 35.8%),repeating-linear-gradient(135deg,transparent 0 38px,#ffffff04 39px 40px);pointer-events:none}
.profile-cover:after{font-size:clamp(25px,4vw,42px);letter-spacing:5px;color:#ffffff12;right:30px;bottom:18px}
.profile-summary{padding:0 28px 24px;gap:20px;margin-top:-52px;align-items:flex-end}
.profile-summary .avatar{width:112px;height:112px;border:5px solid #111216;outline:2px solid #d71926;box-shadow:0 8px 22px #0009;font-size:30px}
.profile-name{font-size:30px;line-height:1.2;overflow-wrap:anywhere}
.role-pill{background:#2a0d11;border-color:#85232c;color:#ff7c83;text-transform:uppercase;letter-spacing:.25px}
.profile-tabs{padding:0 26px;gap:8px}
.profile-tabs button{padding:15px 17px;font-weight:700;transition:color .15s}
.profile-tabs button:hover{color:#fff}
.profile-tabs button.active{color:#ff4a54;border-bottom:3px solid #e1222e}
.profile-details{padding:22px 26px;gap:13px}
.detail{border:1px solid #292c32;background:linear-gradient(140deg,#191a1f,#141519);padding:15px;border-radius:9px;min-width:0;overflow-wrap:anywhere}
.detail span{letter-spacing:.2px}
.modal{border-color:#484c53;box-shadow:0 25px 80px #000b}
.modal-head{background:linear-gradient(100deg,#df1c29,#a90f19)}
.btn.primary{background:linear-gradient(135deg,#f52f3a,#b80f1b);box-shadow:0 3px 0 #680a12}
.btn.primary:hover{filter:brightness(1.08)}
.field input,.field textarea,.field select,.search-input{background:#17191e;border-color:#35383f}
.drawer-panel{background:#111216;border-right-color:#3d2529}
.drawer-link{border-bottom:1px solid #ffffff06}
.footer{border-color:#292b31}
@media(min-width:1200px){.layout{grid-template-columns:minmax(0,1fr) 318px;gap:24px}.section-body{padding:16px 18px}.forum-row{grid-template-columns:126px minmax(0,1fr)}.hero h1{font-size:32px}}

/* DARK MOBILE desktop polish and interaction states */
:root{--red:#d91f2b;--red2:#ff4652;--panel:#111318;--line:#373b43}
body{background:radial-gradient(ellipse at 50% -25%,#292b31 0,transparent 52%),#08090c}
.topbar{height:82px;gap:20px;background:rgba(20,21,25,.97);backdrop-filter:blur(14px);padding-inline:max(28px,calc((100% - 1480px)/2));}
.brand{width:210px;height:66px;border-radius:4px;border-color:#4b4e55;background:linear-gradient(145deg,#15161a,#0c0d10);font-weight:800;letter-spacing:1px;box-shadow:inset 0 0 0 1px #ffffff05}
.brand-mark{font-size:22px}
.wrap{max-width:1480px;padding:30px 30px 56px}
.layout{grid-template-columns:minmax(0,1fr) 330px;gap:28px}
.hero{min-height:190px;padding:34px 38px;border-color:#42464d;background:linear-gradient(110deg,#17191e 0%,#0c0d11 62%,#1b0d10 100%);}
.hero-emblem{width:118px;height:118px;font-size:34px;background:radial-gradient(circle at 35% 30%,#24262c,#050506 72%);border-color:#6a252b;color:#ff4b55}
.hero h1{font-size:36px;letter-spacing:1.4px}
.hero p{font-size:15px;max-width:660px}
.section,.side-card{border-color:#454a52;box-shadow:0 14px 40px #0005,0 0 22px #bfc5ce0a}
.section-title{padding:19px 24px;background:linear-gradient(90deg,#1d1e22,#151619);font-size:24px}
.section-body{padding:19px 22px}
.forum-category{border-color:#3d4249;background:#0b0c10;transition:border-color .2s,transform .2s}
.forum-category:hover{border-color:#5d626a}
.category-head{padding:16px 20px;font-size:21px;background:linear-gradient(90deg,#202125,#18191d);letter-spacing:.3px}
.forum-row{grid-template-columns:132px minmax(0,1fr);gap:20px;padding:22px 24px;min-height:154px;transition:background .18s;cursor:pointer}
.forum-row:hover{background:linear-gradient(90deg,#ffffff04,#d91f2b08)}
.forum-icon{width:92px;height:92px;border:1px solid #191b20;box-shadow:0 0 0 7px #ffffff02;background:radial-gradient(circle at 35% 25%,#111318,#030405 72%);color:#f1f2f5}
.forum-name{font-size:26px;display:inline-block;transition:color .18s}
.forum-meta{font-size:14px;color:#aeb2ba}
.lastpost{max-width:100%;font-size:14px}
.side-title{background:#17191d;padding:19px 21px;font-size:20px}
.side-content{padding:18px 20px}
.online-user{border:1px solid #24272d;transition:border-color .2s,background .2s}
.online-user:hover{border-color:#7b2a31;background:#201316}
.message-card{border:1px solid #22252b;transition:border-color .2s}
.message-card:hover{border-color:#4a2a2e}
.topic-row{padding:18px 16px;transition:background .18s;cursor:pointer}
.topic-row:hover{background:#ffffff04}
.topic-title{line-height:1.35}
.profile-cover{height:190px;background:radial-gradient(ellipse at 20% 20%,#48131a 0,transparent 55%),linear-gradient(110deg,#17090c,#111319 55%,#260b10)}
.profile-summary{padding:0 30px 24px;gap:24px}
.profile-tabs button{font-weight:700;cursor:pointer}
.profile-tabs button:hover{color:#fff;background:#ffffff05}
.btn,.back,.iconbtn,.collapse,.category-head button,.sharebox{transition:all .18s ease}
.btn:active,.iconbtn:active{transform:translateY(1px)}
.sharebox{cursor:pointer;border:1px solid transparent}.sharebox:hover{border-color:#4b2a30;color:#fff}
.desktop-users{display:inline-flex}
.drawer{position:fixed;inset:0;background:#000b;z-index:55;display:flex}
.drawer-panel{width:min(370px,88vw);height:100%;overflow:auto;padding:24px;background:#101115;border-right:1px solid #4a2025;box-shadow:20px 0 70px #0009}
.drawer-link{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 12px;background:transparent;border:0;color:#dfe0e4;font-weight:600;font-size:15px;border-radius:8px;cursor:pointer}
.drawer-link:hover{background:#261216;color:#ff6871}
.drawer-link span{width:28px;text-align:center;font-size:22px}
.toast{position:fixed;z-index:100;left:50%;bottom:26px;transform:translateX(-50%);padding:13px 18px;background:#17191e;border:1px solid #5a3338;border-radius:10px;box-shadow:0 12px 40px #000b;color:#fff;max-width:min(90vw,600px)}
.empty{padding:24px;text-align:center;color:#a9adb5}
@media(min-width:1500px){.layout{grid-template-columns:minmax(0,1fr) 350px;gap:30px}.forum-row{grid-template-columns:145px minmax(0,1fr);padding:24px 28px}.section-body{padding:22px 25px}}
@media(max-width:1000px){.topbar{padding-inline:20px}.wrap{max-width:900px}.layout{grid-template-columns:minmax(0,1fr)}.sidebar{grid-template-columns:repeat(2,minmax(0,1fr))}.desktop-users{display:none}}
@media(max-width:680px){.topbar{height:70px;padding:0 12px;gap:10px}.brand{height:54px;width:112px;font-size:12px}.brand:before{width:40px;height:40px;flex-basis:40px;background-size:contain}.wrap{padding:15px 10px 30px}.hero{padding:17px 15px;min-height:unset}.hero h1{font-size:20px}.hero-emblem{width:58px;height:58px;font-size:22px}.section-title{font-size:18px;padding:14px 13px}.section-body{padding:9px}.category-head{font-size:16px;padding:12px 13px}.forum-row{grid-template-columns:54px minmax(0,1fr);gap:10px;padding:15px 9px;min-height:unset}.forum-icon{width:48px;height:48px}.forum-name{font-size:17px}.lastpost{font-size:12px}.profile-cover{height:116px}.profile-summary{padding:0 13px 16px;gap:11px;margin-top:-31px}.desktop-users{display:none}}
.users-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.user-tile{display:flex;align-items:center;gap:10px;text-align:left;padding:15px;background:#15171c;border:1px solid #292d34;border-radius:10px;min-width:0;cursor:pointer}.user-tile:hover{border-color:#81313a;background:#1b1215}.user-tile .avatar{width:42px;height:42px;flex-shrink:0}.user-tile-name{font-weight:800;overflow-wrap:anywhere}.user-tile .role-pill{margin:0;font-size:10px;white-space:nowrap}.user-tile small{color:#9da1a9;margin-left:auto;white-space:nowrap}@media(max-width:1100px){.users-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.users-grid{grid-template-columns:1fr}.user-tile{flex-wrap:wrap}.user-tile small{margin-left:52px;width:100%}}

<body>
<header class="topbar">
  <button class="hamb" aria-label="Открыть меню" onclick="toggleDrawer(true)">☰</button>

    <button class="iconbtn" title="Поиск" onclick="toggleSearch()">⌕</button>

  </div>
</header>
<div class="redline"></div>
<main class="wrap" id="app"></main>
<footer class="footer">DARK MOBILE COMMUNITY · Форум игрового проекта <div style="margin-top:7px">Демонстрационный HTML-прототип · Данные сохраняются в этом браузере</div></footer>
<div id="modalRoot"></div><div id="drawerRoot"></div><div id="toastRoot"></div>
<script>
const STORE='darkMobileForum_v1';
const defaultData={
 users:[],
 categories:[
 {id:'main',name:'ОСНОВНОЙ РАЗДЕЛ',forums:[
 {id:'news',name:'Новости и информация',icon:'game',topics:0,posts:0,new:false,last:null},
 {id:'tech',name:'Технический раздел',icon:'chat',topics:0,posts:0,last:null},
 {id:'ideas',name:'Предложения по улучшению',icon:'chat',topics:0,posts:0,last:null}
 ]},
 {id:'servers',name:'ИГРОВЫЕ СЕРВЕРА',forums:[
 {id:'rules',name:'Правила серверов',icon:'chat',topics:0,posts:0,last:null},
 {id:'server1',name:'Сервер №1 DARK',icon:'game',topics:0,posts:0,new:false,last:null}
 ]},
 {id:'other',name:'ПРОЧЕЕ',forums:[
 {id:'help',name:'Помощь',icon:'game',topics:0,posts:0,last:null},
 {id:'chat',name:'Курилка',icon:'game',topics:0,posts:0,last:null},
 {id:'media',name:'MEDIA Раздел',icon:'game',topics:0,posts:0,new:false,last:null}
 ]}
 ],
 topics:[],
 posts:[],
 messages:[],
 follows:[], notifications:[], reports:[], bookmarks:[], activity:[]
};
let data=loadData(),currentUser=null,view={page:'home'},collapsed={},searchOpen=false;
// Clean migration: remove only built-in showcase accounts/content; keep real locally-created accounts.
const demoNames=['Dark_Admin','Boss_Forbes','Katana_White','Shourup_Sharface','Evans_Borzov','Andrew_Masslenikov'];
if(!Array.isArray(data.users))data.users=[];if(!Array.isArray(data.topics))data.topics=[];if(!Array.isArray(data.posts))data.posts=[];if(!Array.isArray(data.messages))data.messages=[];if(!Array.isArray(data.supportTickets))data.supportTickets=[];
const removedTopicIds=new Set(data.topics.filter(t=>demoNames.includes(t.author)).map(t=>t.id));
data.users=data.users.filter(u=>!demoNames.includes(u.name));data.topics=data.topics.filter(t=>!demoNames.includes(t.author));data.posts=data.posts.filter(p=>!demoNames.includes(p.author)&&!removedTopicIds.has(p.topic));data.messages=data.messages.filter(m=>!demoNames.includes(m.user));
data.categories.forEach(c=>c.forums.forEach(f=>{if(f.last&&demoNames.includes(f.last.user)){f.last=null;f.topics=0;f.posts=0;f.new=false}}));
for(const k of ['follows','notifications','reports','bookmarks','activity'])if(!Array.isArray(data[k]))data[k]=[];
// Project owner account: admin@gmail.com / 123456
let owner=data.users.find(u=>String(u.email||'').toLowerCase()==='admin@gmail.com'||u.name==='admin');
if(!owner){owner={id:'darkmobile-owner',name:'admin',email:'admin@gmail.com',password:'123456',role:'Основатель',isAdmin:true,joined:new Date().toLocaleDateString('ru-RU'),posts:0,avatar:'',banner:'',bio:'Администратор проекта DARK MOBILE',badges:['Основатель'],online:false};data.users.push(owner)}
else{owner.id=owner.id||'darkmobile-owner';owner.name='admin';owner.email='admin@gmail.com';owner.password='123456';owner.role='Основатель';owner.isAdmin=true;owner.badges=Array.from(new Set([...(owner.badges||[]),'Основатель']))}
saveData();

let savedTopics=(()=>{try{return JSON.parse(localStorage.getItem('darkMobileForum_savedTopics')||'[]')}catch(e){return []}})();
try{const savedUser=localStorage.getItem('darkMobileForum_currentUser');if(savedUser){const found=data.users.find(u=>u.id===savedUser);if(found)currentUser=found}}catch(e){}
function loadData(){try{let d=JSON.parse(localStorage.getItem(STORE));return d||structuredClone(defaultData)}catch(e){return JSON.parse(JSON.stringify(defaultData))}}
function saveData(){localStorage.setItem(STORE,JSON.stringify(data))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function userByName(n){return data.users.find(u=>u.name.toLowerCase()===String(n).toLowerCase())}
function avatar(u,cls='avatar'){if(!u)return `<div class="${cls}">?</div>`;return `<div class="${cls}">${u.avatar?`<img src="${u.avatar}" alt="">`:esc((u.name||'?').slice(0,1).toUpperCase())}</div>`}
function forumById(id){for(const c of data.categories){let f=c.forums.find(x=>x.id===id);if(f)return f}return null}
function categoryByForum(id){return data.categories.find(c=>c.forums.some(f=>f.id===id))}
function iconSvg(type){if(type==='chat')return '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 14c0-7 8-12 18-12s18 5 18 12-8 12-18 12c-3 0-6-.5-8-1.5L7 29l3-9c-1-2-2-4-2-6zm24 15c13 0 24 7 24 16 0 4-2 7-5 10l2 7-12-4c-3 1-6 2-9 2-13 0-24-7-24-16 0-8 11-15 24-15z"/></svg>';return '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 17h9l4-7h12l4 7h5c7 0 11 5 11 12v16c0 5-4 8-9 8H10c-5 0-8-3-8-8V29c0-7 5-12 11-12h5zm-3 11v6H9v6h6v6h6v-6h6v-6h-6v-6h-6zm32 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm-8 9a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>'}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',3000)}
function goHome(){view={page:'home'};render();window.scrollTo(0,0)}
function toggleSearch(){searchOpen=!searchOpen;render()}
function showActivity(){view={page:'activity'};render()}

function openAdminPanel(){if(!currentUser||!(currentUser.isAdmin||currentUser.role==='Основатель')){toast('Доступ только для администрации');return}view.page='admin';render();toggleDrawer(false)}
function adminPage(){const topics=data.topics||[],users=data.users||[],reports=data.reports||[],tickets=data.supportTickets||[];return `<div class="page-head"><button class="back" onclick="goHome()">← Главная</button><span class="crumb">/ Панель управления</span></div><section class="admin-panel"><h2>Панель управления DARK MOBILE</h2><p class="muted">Управление данными форума в этом браузере.</p><div class="admin-grid"><div class="admin-tile"><strong>${users.length}</strong>Аккаунтов</div><div class="admin-tile"><strong>${topics.length}</strong>Тем</div><div class="admin-tile"><strong>${(data.posts||[]).length}</strong>Ответов</div><div class="admin-tile"><strong>${reports.length}</strong>Жалоб</div><div class="admin-tile"><strong>${tickets.length}</strong>Обращений</div></div></section><section class="section"><div class="section-title">Аккаунты и роли</div><div class="section-body">${users.map(u=>`<div class="topic-row"><div><b>${esc(u.name)}</b><div class="muted">${esc(u.email||'')}</div></div><div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="label">${esc(u.role||'Пользователь')}</span>${u.id!==currentUser.id?`<button class="btn small" onclick="adminSetRole('${esc(u.id)}')">Изменить роль</button>`:''}</div></div>`).join('')||'<p class="muted">Аккаунтов пока нет.</p>'}</div></section><section class="section"><div class="section-title">Модерация тем</div><div class="section-body">${topics.map(t=>`<div class="topic-row"><div><b>${esc(t.title)}</b><div class="muted">Автор: ${esc(t.author||'')}</div></div><button class="btn small" onclick="adminDeleteTopic('${esc(t.id)}')">Удалить тему</button></div>`).join('')||'<p class="muted">Тем пока нет.</p>'}</div></section><section class="section"><div class="section-title">Система</div><div class="section-body"><button class="btn" onclick="adminExport()">Экспорт JSON</button> <button class="btn" onclick="adminResetTopics()">Очистить темы и ответы</button></div></section>`}
function adminSetRole(id){if(!currentUser?.isAdmin)return;const u=data.users.find(x=>x.id===id);if(!u)return;const role=prompt('Новая роль (Пользователь, Модератор, Администратор):',u.role||'Пользователь');if(!role)return;u.role=role;u.isAdmin=role==='Администратор';saveData();render();toast('Роль обновлена')}
function adminDeleteTopic(id){if(!currentUser?.isAdmin)return;if(!confirm('Удалить тему и ответы?'))return;data.topics=data.topics.filter(t=>t.id!==id);data.posts=data.posts.filter(p=>p.topic!==id);saveData();render();toast('Тема удалена')}
function adminExport(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dark-mobile-backup.json';a.click();URL.revokeObjectURL(url)}
function adminResetTopics(){if(!currentUser?.isAdmin)return;if(!confirm('Удалить все темы и ответы?'))return;data.topics=[];data.posts=[];saveData();render();toast('Темы и ответы очищены')}

function render(){const app=document.getElementById('app');const userTop=document.getElementById('userTop');if(userTop){userTop.classList.toggle('hidden',!currentUser);if(currentUser)userTop.textContent=currentUser.name.slice(0,1).toUpperCase();}const actions=document.querySelector('.top-actions');if(actions){let adminBtn=document.getElementById('adminQuickBtn');if(currentUser&&(currentUser.isAdmin||currentUser.role==='Основатель')){if(!adminBtn){adminBtn=document.createElement('button');adminBtn.id='adminQuickBtn';adminBtn.className='iconbtn';adminBtn.title='Панель администратора';adminBtn.textContent='⚙';adminBtn.onclick=openAdminPanel;actions.insertBefore(adminBtn,userTop)}}else if(adminBtn)adminBtn.remove();}
if(view.page==='home')app.innerHTML=homePage();else if(view.page==='forum')app.innerHTML=forumPage(view.forum);else if(view.page==='topic')app.innerHTML=topicPage(view.topic);else if(view.page==='profile')app.innerHTML=profilePage(view.user);else if(view.page==='activity')app.innerHTML=activityPage();else if(view.page==='users')app.innerHTML=usersPage();else if(view.page==='admin')app.innerHTML=adminPage();else app.innerHTML=homePage();}
function homePage(){let cats=data.categories.map(c=>`<section class="forum-category"><div class="category-head"><span>${esc(c.name)}</span><button aria-label="Свернуть раздел" onclick="toggleCategory('${c.id}')">${collapsed[c.id]?'⌄':'⌃'}</button></div>${collapsed[c.id]?'':c.forums.map(f=>`<div class="forum-row" role="link" tabindex="0" onclick="if(!event.target.closest('a,button'))openForum('${f.id}')" onkeydown="if(event.key==='Enter')openForum('${f.id}')"><div class="forum-icon">${iconSvg(f.icon)}</div><div><a class="forum-name" href="#" onclick="openForum('${f.id}');return false">${esc(f.name)}</a>${f.new?'<span class="new-tag">НОВОЕ</span>':''}<div class="forum-meta">Темы: ${f.topics} Сообщения: ${f.posts}</div>${f.last?`<div class="lastpost"><span class="label">${esc(f.last.label||'ВАЖНО')}</span><span>${esc(f.last.title)}</span></div><div class="lastpost muted">${avatar(userByName(f.last.user),'tiny-avatar')}<span>· ${esc(f.last.time)} · <a href="#" onclick="openProfileByName('${esc(f.last.user)}');return false">${esc(f.last.user)}</a></span></div>`:'<div class="lastpost muted">Нет</div>'}</div></div>`).join('')}</section>`).join('');
let recent=data.topics.slice().sort((a,b)=>data.topics.indexOf(b)-data.topics.indexOf(a)).slice(0,5);
return `${searchOpen?`<div class="section"><div class="section-body"><div class="toolbar"><input class="search-input" id="globalSearch" placeholder="Поиск тем, разделов и пользователей..." oninput="runSearch(this.value)"><button class="btn" onclick="toggleSearch()">Закрыть</button></div><div id="searchResults"></div></div></div>`:''}
<div class="hero"><div class="hero-emblem">DM</div><div><h1>DARK MOBILE</h1><p>Официальное сообщество игрового проекта.<br>Новости, обсуждения, помощь и общение игроков.</p><div class="hero-actions"><button class="btn primary" onclick="${currentUser?'createTopicPrompt()':'openAuth(&quot;register&quot;)'}">${currentUser?'＋ Создать тему':'♙ Регистрация'}</button><button class="btn" onclick="${currentUser?'openMyProfile()':'openAuth(&quot;login&quot;)'}">${currentUser?'Мой профиль':'⇥ Войти'}</button></div></div></div>
<div class="layout"><div><section class="section"><div class="section-title"><span>Форумы <span class="accent">DARK MOBILE</span></span><span class="muted" style="font-size:13px;font-weight:400">Главная</span></div><div class="section-body">${cats}</div></section>
<section class="section"><div class="section-title">Последние сообщения</div><div class="section-body">${recent.map(t=>{let u=userByName(t.author);return `<div class="message-card">${avatar(u)}<div><div class="message-title">${t.label?`<span class="label ${t.label==='НА РАССМОТРЕНИИ'?'review':''}">${esc(t.label)}</span> `:''}<a href="#" onclick="openTopic('${t.id}');return false">${esc(t.title)}</a></div><div class="message-meta">От: <a href="#" onclick="openProfileByName('${esc(t.author)}');return false">${esc(t.author)}</a> · ${esc(t.date)}<br>${esc((forumById(t.forum)||{}).name||'Форум')}</div></div></div>`}).join('')}</div></section></div>
<aside class="sidebar"><section class="side-card"><div class="side-title">Пользователи онлайн</div><div class="side-content">${data.users.filter(u=>u.online).map(u=>`<div class="online-user"><a href="#" onclick="openProfileByName('${esc(u.name)}');return false">${esc(u.name)}</a></div>`).join('')||'<div>Сейчас никого нет</div>'}<div style="margin-top:12px;color:#9fa3aa">Всего: ${data.users.filter(u=>u.online).length+1} (пользователей: ${data.users.filter(u=>u.online).length}, гостей: 1)</div></div></section>
<section class="side-card"><div class="side-title">Сообщения профилей</div><div class="side-content">${data.messages.slice(0,3).map(m=>`<div class="profile-message">${avatar(userByName(m.user))}<div><a href="#" onclick="openProfileByName('${esc(m.user)}');return false">${esc(m.user)}</a><div style="margin-top:4px">${esc(m.body)}</div><div class="muted" style="margin-top:4px">${esc(m.date)}</div></div></div>`).join('')}</div></section>
<section class="side-card"><div class="side-title">Статистика форума</div><div class="side-content"><div class="statline"><span>Темы:</span><strong>${data.categories.flatMap(c=>c.forums).reduce((n,f)=>n+f.topics,0)}</strong></div><div class="statline"><span>Сообщения:</span><strong>${data.categories.flatMap(c=>c.forums).reduce((n,f)=>n+f.posts,0)+data.posts.length}</strong></div><div class="statline"><span>Пользователи:</span><strong>${data.users.length}</strong></div><div class="statline"><span>Новый пользователь:</span><strong>${esc(data.users[data.users.length-1].name)}</strong></div></div></section>
<section class="side-card"><div class="side-content"><div class="sharebox" onclick="shareForum()">♧ &nbsp;Поделиться</div></div></section></aside></div>`}
function toggleCategory(id){collapsed[id]=!collapsed[id];render()}
function showUsers(){view={page:'users'};render();window.scrollTo(0,0)}
function usersPage(){return `<div class="page-head"><button class="back" onclick="goHome()">← Главная</button><span class="crumb">/ Пользователи</span></div><section class="section"><div class="section-title">Пользователи форума <span class="muted" style="font-size:13px;font-weight:400">${data.users.length} аккаунта</span></div><div class="section-body"><div class="users-grid">${data.users.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(u=>`<button class="user-tile" onclick="openProfileByName('${esc(u.id)}')">${avatar(u)}<span class="user-tile-name">${esc(u.name)}</span><span class="role-pill">${esc(u.role)}</span><small>${u.online?'● В сети':'Не в сети'} · ${u.posts} сообщений</small></button>`).join('')}</div></div></section>`}
function openForum(id){view={page:'forum',forum:id};render();window.scrollTo(0,0)}
function forumPage(id){let f=forumById(id);if(!f)return homePage();let topics=data.topics.filter(t=>t.forum===id);return `<div class="page-head"><button class="back" onclick="goHome()">← Главная</button><span class="crumb">/ ${esc((categoryByForum(id)||{}).name||'Форум')} /</span></div><section class="section"><div class="section-title"><span>${esc(f.name)}</span><button class="btn primary small" onclick="${currentUser?'createTopicPrompt()':'openAuth(&quot;login&quot;)'}">＋ Создать тему</button></div><div class="section-body"><div class="muted" style="padding:5px 3px 15px">Темы: ${f.topics} · Сообщения: ${f.posts}</div>${topics.length?topics.map(t=>`<div class="topic-row"><div class="avatar" style="width:40px;height:40px">${esc((t.author||'?')[0])}</div><div><a class="topic-title" href="#" onclick="openTopic('${t.id}');return false">${t.label?`<span class="label ${t.label==='НА РАССМОТРЕНИИ'?'review':''}">${esc(t.label)}</span> `:''}${esc(t.title)}</a><div class="topic-sub">Автор: <a href="#" onclick="openProfileByName('${esc(t.author)}');return false">${esc(t.author)}</a> · ${esc(t.date)}</div></div><div class="topic-count">Ответов<br><b>${t.replies}</b></div></div>`).join(''):'<div class="empty">В этом разделе пока нет тем.<br><button class="btn primary" style="margin-top:15px" onclick="'+(currentUser?'createTopicPrompt()':'openAuth(&quot;login&quot;)')+'">Создать первую тему</button></div>'}</div></section>`}
function openTopic(id){view={page:'topic',topic:id};render();window.scrollTo(0,0)}
function toggleSavedTopic(id){if(savedTopics.includes(id))savedTopics=savedTopics.filter(x=>x!==id);else savedTopics.push(id);try{localStorage.setItem('darkMobileForum_savedTopics',JSON.stringify(savedTopics))}catch(e){}render();toast(savedTopics.includes(id)?'Тема добавлена в закладки.':'Тема удалена из закладок.')}
function topicPage(id){let t=data.topics.find(x=>x.id===id);if(!t)return homePage();let f=forumById(t.forum);let posts=data.posts.filter(p=>p.topic===id);let mainUser=userByName(t.author);return `<div class="page-head"><button class="back" onclick="openForum('${t.forum}')">← ${esc(f?f.name:'Форум')}</button><span class="crumb">/ ${esc(t.title)}</span></div><section class="section"><div class="section-title"><span>${t.label?`<span class="label ${t.label==='НА РАССМОТРЕНИИ'?'review':''}">${esc(t.label)}</span> `:''}${esc(t.title)}</span><button class="btn small" onclick="toggleSavedTopic('${t.id}')">${savedTopics.includes(t.id)?'★ В закладках':'☆ В закладки'}</button></div><div class="section-body" style="padding:0">${posts.length?posts.map((p,i)=>{let u=userByName(p.author);return `<article class="post"><div class="post-author">${avatar(u)}<div style="font-weight:800;margin-top:8px">${esc(p.author)}</div><div class="muted" style="margin-top:6px">${esc(u?u.role:'Пользователь')}</div><div class="muted" style="margin-top:8px">Сообщений: ${u?u.posts:0}</div></div><div class="post-content"><div class="post-top"><span>#${i+1} · ${esc(p.date)}</span><span>${u&&u.role.includes('Администратор')?'✓':''}</span></div>${esc(p.body).replace(/\n/g,'<br>')}</div></article>`}).join(''):`<article class="post"><div class="post-author">${avatar(mainUser)}<div style="font-weight:800;margin-top:8px">${esc(t.author)}</div><div class="muted">${esc(mainUser?mainUser.role:'Пользователь')}</div></div><div class="post-content"><div class="post-top"><span>${esc(t.date)}</span><span>#1</span></div>${esc(t.body).replace(/\n/g,'<br>')}</div></article>`}</div>${currentUser?`<div class="section-body"><div class="field"><label>Ваш ответ</label><textarea id="replyBody" rows="4" placeholder="Напишите сообщение..."></textarea></div><button class="btn primary" onclick="submitReply('${t.id}')">Отправить ответ</button></div>`:`<div class="section-body"><div class="notice">Чтобы ответить в теме, необходимо <a href="#" onclick="openAuth('login');return false">войти</a> в аккаунт.</div></div>`}</section>`}
function profilePage(name){let u=data.users.find(x=>x.id===name||x.name.toLowerCase()===String(name).toLowerCase());if(!u)return homePage();let mine=currentUser&&currentUser.id===u.id;let authored=data.topics.filter(t=>t.author===u.name);let followed=currentUser&&data.follows.some(x=>x.from===currentUser.id&&x.to===u.id);let badges=(u.badges||[]).map(b=>`<span class="label">${esc(b)}</span>`).join(' ');return `<div class="page-head"><button class="back" onclick="goHome()">← Главная</button><span class="crumb">/ Профиль / ${esc(u.name)}</span></div><section class="section"><div class="profile-cover" style="${u.banner?`background-image:linear-gradient(90deg,#09090999,#09090944),url('${u.banner}');background-size:cover;background-position:center`:''}"></div><div class="profile-summary">${avatar(u)}<div style="padding-bottom:4px"><div class="profile-name">${esc(u.name)}</div><div class="role-pill">${esc(u.role||'Пользователь')}</div><div style="margin-top:7px">${badges}</div><div class="muted" style="margin-top:8px">На форуме с ${esc(u.joined||'сегодня')}</div></div><div style="margin-left:auto;align-self:flex-end;padding-bottom:4px;display:flex;gap:7px;flex-wrap:wrap">${mine?'<button class="btn small" onclick="editProfile()">Редактировать профиль</button>':`<button class="btn small" onclick="toggleFollow('${esc(u.id)}')">${followed?'Отписаться':'Подписаться'}</button><button class="btn small" onclick="messageUser('${esc(u.name)}')">Сообщение</button><button class="btn small" onclick="reportUser('${esc(u.id)}')">Пожаловаться</button>`}</div></div><div class="profile-tabs"><button class="active" onclick="profileTab('about')">Профиль</button><button onclick="profileTab('topics')">Темы (${authored.length})</button><button onclick="profileTab('activity')">Активность</button></div><div id="profileTabContent"><div class="profile-details"><div class="detail"><span>Имя пользователя</span>${esc(u.name)}</div><div class="detail"><span>Статус</span>${u.online?'● В сети':'Не в сети'}</div><div class="detail"><span>Дата регистрации</span>${esc(u.joined||'')}</div><div class="detail"><span>Сообщения</span>${Number(u.posts||0)}</div><div class="detail"><span>Подписчики</span>${data.follows.filter(x=>x.to===u.id).length}</div><div class="detail"><span>Подписки</span>${data.follows.filter(x=>x.from===u.id).length}</div><div class="detail" style="grid-column:1/-1"><span>О себе</span>${esc(u.bio||'Информация пока не добавлена.')}</div>${u.vk?`<div class="detail">VK: ${esc(u.vk)}</div>`:''}${u.telegram?`<div class="detail">Telegram: ${esc(u.telegram)}</div>`:''}</div></div>${mine&&isForumOwner()?'<div class="section-body"><button class="btn" onclick="openRoleManager()">♛ Управление ролями</button></div>':''}</section>`}
function profileTab(tab){let root=document.getElementById('profileTabContent');let u=data.users.find(x=>x.id===view.user||x.name.toLowerCase()===String(view.user).toLowerCase());if(!u)return;if(tab==='about'){root.innerHTML=`<div class="profile-details"><div class="detail"><span>Имя пользователя</span>${esc(u.name)}</div><div class="detail"><span>Статус</span>${u.online?'● В сети':'Не в сети'}</div><div class="detail"><span>Дата регистрации</span>${esc(u.joined)}</div><div class="detail"><span>Сообщения</span>${u.posts}</div><div class="detail" style="grid-column:1/-1"><span>О себе</span>${esc(u.bio||'Пользователь пока ничего не рассказал о себе.')}</div></div>`}else if(tab==='topics'){let ts=data.topics.filter(t=>t.author===u.name);root.innerHTML=ts.length?ts.map(t=>`<div class="topic-row"><div class="avatar">${esc(u.name[0])}</div><div><a class="topic-title" onclick="openTopic('${t.id}')">${esc(t.title)}</a><div class="topic-sub">${esc(t.date)}</div></div></div>`).join(''):'<div class="empty">Пользователь ещё не создал тем.</div>'}else{root.innerHTML=`<div class="section-body"><div class="detail"><span>Последняя активность</span>${u.online?'Пользователь сейчас в сети':'Недавно'}</div><div class="detail" style="margin-top:10px"><span>Сообщений</span>${u.posts}</div></div>`}}
function openProfileByName(name){view={page:'profile',user:name};render();window.scrollTo(0,0)}
function openMyProfile(){if(currentUser)openProfileByName(currentUser.id);else openAuth('login')}
function activityPage(){return `<div class="page-head"><button class="back" onclick="goHome()">← Главная</button></div><section class="section"><div class="section-title">Последняя активность</div><div class="section-body">${data.topics.slice().reverse().map(t=>`<div class="topic-row"><div class="avatar">${esc(t.author[0])}</div><div><a class="topic-title" onclick="openTopic('${t.id}')">${esc(t.title)}</a><div class="topic-sub">${esc(t.author)} · ${esc(t.date)}</div></div></div>`).join('')}</div></section>`}
function openAuth(mode){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><span>${mode==='register'?'РЕГИСТРАЦИЯ':'ВХОД НА ФОРУМ'}</span><button class="close" onclick="closeModal()">×</button></div><form id="authForm" onsubmit="submitAuth(event,'${mode}')"><div class="form-body"><div id="authNotice"></div>${mode==='register'?`<div class="field"><label>Имя пользователя: <span class="required">Обязательно</span></label><input name="name" required minlength="3" maxlength="24" autocomplete="username"><div class="hint">Это имя будет отображаться в Ваших сообщениях.</div></div><div class="field"><label>Электронная почта: <span class="required">Обязательно</span></label><input name="email" type="email" required autocomplete="email"></div>`:`<div class="field"><label>Имя пользователя или электронная почта</label><input name="identity" required autocomplete="username"></div>`}<div class="field"><label>Пароль: <span class="required">Обязательно</span></label><div class="password-wrap"><input id="authPassword" name="password" type="password" required minlength="${mode==='register'?6:1}" autocomplete="${mode==='register'?'new-password':'current-password'}"><button type="button" onclick="togglePassword()">◉ Показать</button></div>${mode==='register'?'<div class="hint">Минимум 6 символов.</div>':''}</div>${mode==='register'?`<div class="field"><label>Подтверждение пароля</label><input name="confirm" type="password" required minlength="6"></div><div class="checkbox-line"><input type="checkbox" name="terms" required><span>Я согласен(на) с правилами форума и политикой конфиденциальности.</span></div>`:`<div class="checkbox-line"><input type="checkbox" name="remember" checked><span>Оставаться в системе на этом устройстве</span></div>`}<div class="hint" style="font-size:13px">Это локальный демонстрационный прототип: аккаунт хранится только в текущем браузере.</div><div class="auth-switch">${mode==='register'?'Уже есть аккаунт?':'Ещё нет аккаунта?'} <button type="button" onclick="openAuth('${mode==='register'?'login':'register'}')">${mode==='register'?'Войти':'Зарегистрироваться'}</button></div></div><div class="form-bottom"><button class="btn primary" type="submit">${mode==='register'?'РЕГИСТРАЦИЯ':'ВОЙТИ'}</button></div></form></section></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function togglePassword(){let p=document.getElementById('authPassword');if(!p)return;p.type=p.type==='password'?'text':'password';event.target.textContent=p.type==='password'?'◉ Показать':'◉ Скрыть'}
function submitAuth(e,mode){e.preventDefault();let form=e.target,fd=new FormData(form),notice=document.getElementById('authNotice');if(mode==='register'){let name=String(fd.get('name')).trim(),email=String(fd.get('email')).trim().toLowerCase(),pass=String(fd.get('password'));if(pass!==fd.get('confirm')){notice.innerHTML='<div class="notice">Пароли не совпадают.</div>';return}if(data.users.some(u=>u.name.toLowerCase()===name.toLowerCase())){notice.innerHTML='<div class="notice">Это имя пользователя уже занято.</div>';return}if(data.users.some(u=>u.email.toLowerCase()===email)){notice.innerHTML='<div class="notice">Этот адрес электронной почты уже зарегистрирован.</div>';return}let u={id:'u'+Date.now(),name,email,password:pass,role:data.users.length===0?'Основатель':'Пользователь',isAdmin:data.users.length===0,joined:new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}),posts:0,avatar:'',bio:'',online:true};data.users.push(u);currentUser=u;try{localStorage.setItem('darkMobileForum_currentUser',u.id)}catch(e){}saveData();closeModal();render();toast('Аккаунт создан. Добро пожаловать, '+name+'!')}else{let ident=String(fd.get('identity')).toLowerCase(),pass=String(fd.get('password'));let u=data.users.find(x=>x.name.toLowerCase()===ident||x.email.toLowerCase()===ident);if(!u||u.password!==pass){notice.innerHTML='<div class="notice">Неверное имя пользователя, электронная почта или пароль.</div>';return}currentUser=u;u.online=true;try{localStorage.setItem('darkMobileForum_currentUser',u.id)}catch(e){}saveData();closeModal();render();toast('Вы успешно вошли на форум.')}} 
function toggleDrawer(open){let root=document.getElementById('drawerRoot');if(!open){root.innerHTML='';return}root.innerHTML=`<div class="drawer" onclick="if(event.target===this)toggleDrawer(false)"><div class="drawer-panel"><div style="display:flex;justify-content:space-between;align-items:center"><div class="drawer-brand">DARK <span style="color:var(--red)">MOBILE</span></div><button class="close" onclick="toggleDrawer(false)">×</button></div><button class="drawer-link" onclick="toggleDrawer(false);goHome()"><span>⌂</span>Главная страница</button><button class="drawer-link" onclick="toggleDrawer(false);openAuth('login')"><span>⇥</span>Вход</button><button class="drawer-link" onclick="toggleDrawer(false);openAuth('register')"><span>♙</span>Регистрация</button><button class="drawer-link" onclick="toggleDrawer(false);showActivity()"><span>ϟ</span>Последняя активность</button><button class="drawer-link" onclick="toggleDrawer(false);showUsers()"><span>♙</span>Пользователи</button><button class="drawer-link" onclick="toggleDrawer(false);toggleSearch()"><span>⌕</span>Поиск по форуму</button>${currentUser?`<button class="drawer-link" onclick="toggleDrawer(false);openMyProfile()"><span>◉</span>Мой профиль</button><button class="drawer-link" onclick="logout()"><span>↪</span>Выйти (${esc(currentUser.name)})</button>`:''}<div style="border-top:1px solid #292c31;margin-top:15px;padding-top:12px;color:#777;font-size:12px">DARK MOBILE COMMUNITY</div></div></div>`}
function logout(){if(currentUser)currentUser.online=false;currentUser=null;try{localStorage.removeItem('darkMobileForum_currentUser')}catch(e){}saveData();toggleDrawer(false);render();toast('Вы вышли из аккаунта.')}

// Navigation shortcuts are added to the existing drawer without changing the design system.
const _toggleDrawer=toggleDrawer;toggleDrawer=function(open){_toggleDrawer(open);if(!open||!currentUser)return;let panel=document.querySelector('.drawer-panel');if(!panel||panel.querySelector('[data-extra-menu]'))return;let block=document.createElement('div');block.dataset.extraMenu='1';block.innerHTML=`<button class="drawer-link" onclick="toggleDrawer(false);openNotifications()"><span>♧</span>Уведомления (${data.notifications.filter(n=>n.user===currentUser.id&&!n.read).length})</button><button class="drawer-link" onclick="toggleDrawer(false);openDirectMessages()"><span>✉</span>Личные сообщения</button><button class="drawer-link" onclick="toggleDrawer(false);showSavedTopics()"><span>☆</span>Закладки</button><button class="drawer-link" onclick="toggleDrawer(false);supportCenter()"><span>▤</span>Центр обращений</button>${isForumOwner()?'<button class="drawer-link" onclick="toggleDrawer(false);openRoleManager()"><span>♛</span>Управление ролями</button>':''}`;panel.insertBefore(block,panel.lastElementChild)};
function showSavedTopics(){if(!currentUser){openAuth('login');return}let list=savedTopics.map(id=>data.topics.find(t=>t.id===id)).filter(Boolean);document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><span>ЗАКЛАДКИ</span><button class="close" onclick="closeModal()">×</button></div><div class="form-body">${list.length?list.map(t=>`<div class="topic-row"><div>☆</div><div><a class="topic-title" onclick="closeModal();openTopic('${esc(t.id)}')">${esc(t.title)}</a><div class="topic-sub">${esc(t.author)}</div></div></div>`).join(''):'<div class="empty">Сохранённых тем пока нет.</div>'}</div></section></div>`}
// Avatar frames are subtle and use existing avatar elements; no layout redesign.
const _avatar=avatar;avatar=function(u,cls='avatar'){let h=_avatar(u,cls);if(u&&u.frame&&u.frame!=='none')h=h.replace(`class="${cls}"`,`class="${cls} frame-${esc(u.frame)}"`);return h};

render();
</script>
